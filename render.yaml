# Render Blueprint: TruthLens + Sync ID as ONE free Docker web service.
# Free plan: no persistent disk; the instance sleeps after ~15 min idle. See docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: truthlens-syncid
    runtime: docker
    plan: free
    region: singapore
    branch: deploy/render
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TRUTHLENS_PUBLIC
        value: "1"
      - key: TRUTHLENS_MAX_UPLOAD_MB
        value: "50"
      - key: TRUTHLENS_RATE_LIMIT
        value: "20"
      # Secrets generated by Render (never in Git). The seed IS the Sync ID private key.
      - key: SYNCID_SIGNING_SEED
        generateValue: true
      - key: SYNCID_API_TOKEN
        generateValue: true
      - key: TRUTHLENS_ADMIN_TOKEN
        generateValue: true
      # Optional: set in the dashboard to enable the Claude review; the app works without it.
      - key: ANTHROPIC_API_KEY
        sync: false
